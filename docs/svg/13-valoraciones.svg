iddle">Hace 3 días</text><rect x="290.0" y="288.0" width="11.0" height="11.0" rx="2" fill="rgb(76,76,76)"/><rect x="304.0" y="288.0" width="11.0" height="11.0" rx="2" fill="rgb(76,76,76)"/><rect x="318.0" y="288.0" width="11.0" height="11.0" rx="2" fill="rgb(76,76,76)"/><rect x="332.0" y="288.0" width="11.0" height="11.0" rx="2" fill="rgb(76,76,76)"/><rect x="346.0" y="288.0" width="11.0" height="11.0" rx="2" fill="rgb(76,76,76)"/><text x="34.0" y="342.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="rgb(89,89,89)" text-anchor="start" dominant-baseline="middle">Explicó todo con mucha paciencia y me</text><text x="34.0" y="360.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="rgb(89,89,89)" text-anchor="start" dominant-baseline="middle">entregó los resultados el mismo día.</text></g><g id="13_RESENA_Iván_R"><rect x="20.0" y="388.0" width="350.0" height="108.0" rx="10" fill="rgb(255,255,255)" stroke="rgb(199,199,199)" stroke-width="1"/><rect x="32.0" y="400.0" width="40.0" height="40.0" rx="6" fill="rgb(247,247,247)" stroke="rgb(153,153,153)" stroke-width="1"/><path d="M34 402 L70 438 M70 402 L34 438" fill="none" stroke="rgb(153,153,153)" stroke-width="1" stroke-linecap="butt" stroke-linejoin="round"/><text x="84.0" y="414.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="rgb(33,33,33)" text-anchor="start" dominant-baseline="middle">Iván R.</text><text x="84.0" y="432.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="rgb(128,128,128)" text-anchor="start" dominant-baseline="middle">Hace 1 semana</text><rect x="290.0" y="406.0" width="11.0" height="11.0" rx="2" fill="rgb(76,76,76)"/><rect x="304.0" y="406.0" width="11.0" height="11.0" rx="2" fill="rgb(76,76,76)"/><rect x="318.0" y="406.0" width="11.0" height="11.0" rx="2" fill="rgb(76,76,76)"/><rect x="332.0" y="406.0" width="